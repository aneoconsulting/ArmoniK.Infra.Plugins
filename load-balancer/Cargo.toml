[package]
name = "load-balancer"
version = "0.1.0"
edition = "2021"

[dependencies]
armonik = { git = "https://github.com/aneoconsulting/ArmoniK.Api.git", branch = "fl/fix-tcpnodelay", features = [
  "client",
  "server",
  "serde",
] }
async-stream = "0.3"
futures = "0.3"
config = "0.15"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
eyre = "0.6"
rusqlite = { version = "0.38", features = ["bundled"] }
serde_json = "1.0"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
mimalloc = { version = "0.1", features = ["v3"] }
quick_cache = "0.6"
rayon = "1.11"
thread_local = "1.1"
crossbeam-deque = "0.8"
tonic-web = "0.14"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
tracing-flame = "0.2"
inferno = { version = "0.12", default-features = false, features = ["multithreaded"] }
arc-swap = "1.7"
tokio-stream = { version = "0.1", features = ["net"] }
core_affinity = "0.8"

[[bench]]
name = "sessions_unary"
harness = false

[profile.release]
lto = true
